<!doctype html>
<meta charset="utf-8">
<title>Survive Review filmstrip</title>
<!-- QA only, not published: frames of each scene side by side. ?ids=rally,echo &n=6 &scale=2 &times=0.5,1 -->
<style>
  body { background: #0d0b14; color: #ecebf2; font: 12px/1.3 monospace; margin: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; align-items: flex-start; }
  .row b { width: 60px; flex: none; }
  canvas { image-rendering: pixelated; display: block; }
  figure { margin: 0; } figcaption { color: #8a84a0; }
  #errs { color: #ff8a8a; white-space: pre-wrap; }
</style>
<div id="errs"></div>
<div id="out"></div>
<script>window.addEventListener('error', (e) => { document.getElementById('errs').textContent += e.message + ' ' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n'; });</script>
<script src="core.js"></script>
<script src="pixel.js"></script>
<script src="actors.js"></script>
<script src="stage.js"></script>
<script src="copy.js"></script>
<script src="scenes.js"></script>
<script>
  const Q = new URLSearchParams(location.search), n = +(Q.get('n') || 6), sc = +(Q.get('scale') || 2);
  const ids = Q.get('ids') ? Q.get('ids').split(',') : ['pick', 'rally', 'echo', 'arena'];
  const times = Q.get('times') ? Q.get('times').split(',').map(Number) : null;
  for (const id of ids) {
    const d = PB.SRV[id];
    const row = document.createElement('div'); row.className = 'row';
    const b = document.createElement('b'); b.textContent = id; row.append(b);
    const ts = times || Array.from({ length: n }, (_, i) => +(d.dur * (i + 0.5) / n).toFixed(2));
    for (const t of ts) {
      const f = document.createElement('figure'), cv = document.createElement('canvas'); cv.width = d.w; cv.height = d.h;
      cv.style.width = d.w * sc + 'px';
      const c = cv.getContext('2d', { willReadFrequently: true }); c.imageSmoothingEnabled = false;
      try { if (d.map) d.draw(c, t); else PB.stage.render(c, d, t, PB.K); } catch (e) { document.getElementById('errs').textContent += id + ' @' + t + ': ' + e.message + '\n' + e.stack.split('\n')[1] + '\n'; }
      const fc = document.createElement('figcaption'); fc.textContent = 't=' + t; f.append(cv, fc); row.append(f);
    }
    document.getElementById('out').append(row);
  }
  document.body.dataset.done = '1';
</script>
