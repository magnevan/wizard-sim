<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Viewer</title>
<style>
  :root { --bg: #14161b; --panel: #1b1e25; --line: #2b2f39; --text: #c8ccd6; --dim: #7d8392; --acc: #e0b04a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
  #side { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 10px 16px; }
  #views { display: flex; min-height: 0; min-width: 0; }
  #views > div { position: relative; flex: 1; min-width: 0; border-right: 1px solid var(--line); }
  #views > div.off { display: none; }
  #full canvas, #pix canvas { position: absolute; inset: 0; display: block; }
  #pix canvas { image-rendering: pixelated; }
  .tag { position: absolute; top: 6px; left: 8px; color: var(--dim); pointer-events: none; z-index: 1; }
  #bottom { background: var(--panel); border-top: 1px solid var(--line); padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
  #tl { flex: 1; height: 44px; cursor: ew-resize; }
  h3 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  h3:first-child { margin-top: 2px; }
  .list button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 3px 6px; border-radius: 3px; cursor: pointer; font: inherit; }
  .list button:hover { background: #262a33; }
  .list button.on { background: #3a3220; color: var(--acc); }
  .list button small { color: var(--dim); }
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; flex-wrap: wrap; }
  .row label { cursor: pointer; }
  input[type=range] { flex: 1; min-width: 60px; }
  select, button.b { background: #262a33; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; font: inherit; cursor: pointer; }
  button.b.on { border-color: var(--acc); color: var(--acc); }
  .dirs { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; }
  .dirs button { width: 26px; height: 22px; padding: 0; }
  .note { color: var(--dim); line-height: 1.4; margin: 4px 0; }
  .warn { color: #e08a5a; }
  #readout { font-variant-numeric: tabular-nums; min-width: 230px; white-space: nowrap; color: var(--dim); }
  kbd { background: #262a33; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; font: 11px monospace; }
</style>
</head>
<body>
<div id="app">
  <div id="side"></div>
  <div id="views">
    <div id="full"><span class="tag">Full size: drag to orbit, right-drag to pan, wheel to zoom</span></div>
    <div id="pix"><span class="tag" id="pixtag">Pixel (the game's own renderer)</span></div>
  </div>
  <div id="bottom">
    <button class="b" id="play" title="Space">Pause</button>
    <select id="rate" title="Playback speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
    <span id="readout"></span>
    <canvas id="tl"></canvas>
  </div>
</div>
<script type="module" src="./src/lab/models.ts"></script>
</body>
</html>
