<!doctype html>
<meta charset="utf-8">
<title>Spell VFX filmstrip</title>
<!-- QA only, not published: frames of each vignette side by side.
     ?ids=a,b (default: all) &n=6 frames &scale=2 &group=forms &times=0.5,1 &crop=x,y,w,h -->
<style>
  body { background: #0d0b14; color: #ecebf2; font: 12px/1.3 monospace; margin: 8px; }
  .row { display: flex; gap: 4px; margin-bottom: 6px; align-items: flex-start; }
  .row b { width: 110px; flex: none; word-break: break-all; }
  canvas { image-rendering: pixelated; display: block; }
  figure { margin: 0; } figcaption { color: #8a84a0; }
  #errs { color: #ff8a8a; white-space: pre-wrap; }
</style>
<div id="errs"></div>
<div id="out"></div>
<script>window.addEventListener('error', (e) => { document.getElementById('errs').textContent += e.message + ' ' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n'; });</script>
<script src="rules-c.js"></script>
<script src="core.js"></script>
<script src="pixel.js"></script>
<script src="actors.js"></script>
<script src="stage.js"></script>
<script src="fx.js"></script>
<script src="vfx-forms.js"></script>
<script src="vfx-payload.js"></script>
<script src="vfx-shield.js"></script>
<script src="vfx-sigil.js"></script>
<script src="vfx-life.js"></script>
<script src="vfx-deaths.js"></script>
<script src="vfx-deaths-2.js"></script>
<script>
  const Q = new URLSearchParams(location.search), n = +(Q.get('n') || 6), sc = +(Q.get('scale') || 2);
  const ids = Q.get('ids') ? Q.get('ids').split(',') : null, grp = Q.get('group');
  const crop = Q.get('crop') ? Q.get('crop').split(',').map(Number) : null;   // ?crop=x,y,w,h (stage px), zoomed by scale
  const times = Q.get('times') ? Q.get('times').split(',').map(Number) : null;
  for (const d of PB.VFX) {
    if (ids && !ids.includes(d.id)) continue;
    if (grp && d.group !== grp) continue;
    const row = document.createElement('div'); row.className = 'row';
    const b = document.createElement('b'); b.textContent = d.id; row.append(b);
    const ts = times || Array.from({ length: n }, (_, i) => +(d.dur * (i + 0.5) / n).toFixed(2));
    for (const t of ts) {
      const f = document.createElement('figure'), cv = document.createElement('canvas'); cv.width = PB.stage.W; cv.height = PB.stage.H;
      cv.style.width = PB.stage.W * sc + 'px';
      try { PB.stage.render(cv.getContext('2d', { willReadFrequently: true }), d, t, PB.K); } catch (e) { document.getElementById('errs').textContent += d.id + ' @' + t + ': ' + e.message + '\n' + e.stack.split('\n')[1] + '\n'; }
      if (crop) { const cc = document.createElement('canvas'); cc.width = crop[2]; cc.height = crop[3]; cc.getContext('2d').drawImage(cv, crop[0], crop[1], crop[2], crop[3], 0, 0, crop[2], crop[3]); cc.style.width = crop[2] * sc + 'px'; f.append(cc); } else f.append(cv);
      const fc = document.createElement('figcaption'); fc.textContent = 't=' + t; f.append(fc); row.append(f);
    }
    document.getElementById('out').append(row);
  }
</script>
