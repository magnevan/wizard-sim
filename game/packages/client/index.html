<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizard Sim</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #0e1712; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; image-rendering: pixelated; }
    #hud { position: fixed; left: 6px; top: 6px; font: 10px/1.3 ui-monospace, Consolas, monospace; color: #9a96aa; background: rgba(13, 11, 20, 0.6); padding: 2px 5px; border-radius: 3px; pointer-events: none; white-space: pre; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
