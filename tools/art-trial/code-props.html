<!doctype html>
<meta charset="utf8">
<title>Code-drawn academy props</title>
<!-- The art trial's code-drawn set, in the game's own pixel primitives. Headless Chrome dumps the
     sheet as base64 in #out: chrome --headless=new --dump-dom this-file -->
<canvas id="sheet" width="210" height="56"></canvas>
<pre id="out"></pre>
<pre id="all"></pre>
<script src="../spell-vfx/core.js"></script>
<script src="../spell-vfx/pixel.js"></script>
<script>
const X = PB.px, bay = X.bay;
const OUTL = '#1a120c';
const WOOD = ['#d8b88a', '#b8946a', '#977552', '#76583c', '#553e2a', '#33241a'];
const PAPER = ['#fff4e0', '#e8d8b0', '#d8c0a0', '#b8946a'];
const VIO = ['#ffffff', '#efe4ff', '#b08aff', '#7a4ad8', '#4a2a78', '#2a1848'];
const rnd = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

function layer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

/** The game's sprites all carry a one-pixel dark outline. */
function outline(x) {
  const { width: w, height: h } = x.canvas, d = x.getImageData(0, 0, w, h).data, on = (a, b) => a >= 0 && b >= 0 && a < w && b < h && d[(b * w + a) * 4 + 3] > 0;
  for (let b = 0; b < h; b++) for (let a = 0; a < w; a++) if (!on(a, b) && (on(a + 1, b) || on(a - 1, b) || on(a, b + 1) || on(a, b - 1))) X.px(x, a, b, OUTL);
}

/** Wood with a grain: a ramp step, broken up by short darker streaks. */
function plank(x, l, t, w, h, step, seed = 1, vertical = false) {
  X.rect(x, l, t, w, h, WOOD[step]);
  for (let i = 0; i < (w * h) / 9; i++) {
    const a = l + Math.floor(rnd(i, seed) * w), b = t + Math.floor(rnd(i, seed + 1) * h), n = 1 + Math.floor(rnd(i, seed + 2) * 3);
    for (let k = 0; k < n; k++) { const px = vertical ? a : a + k, py = vertical ? b + k : b; if (px < l + w && py < t + h) X.px(x, px, py, WOOD[Math.min(5, step + 1)]); }
  }
}

function lectern() {
  const x = layer(26, 34);
  // the foot
  X.rect(x, 5, 28, 16, 4, WOOD[3]); X.rect(x, 5, 28, 16, 1, WOOD[1]); X.rect(x, 5, 31, 16, 1, WOOD[4]);
  // the column, lit from the upper left
  plank(x, 9, 15, 8, 13, 3, 3, true); X.rect(x, 9, 15, 2, 13, WOOD[2]); X.rect(x, 15, 15, 2, 13, WOOD[4]);
  // the sloped top
  X.poly(x, [[4, 7], [22, 7], [24, 16], [2, 16]], WOOD[2]);
  X.rect(x, 2, 16, 22, 2, WOOD[4]); X.rect(x, 3, 7, 20, 1, WOOD[0]);
  // the open book
  X.poly(x, [[6, 6], [12, 7], [13, 14], [5, 13]], PAPER[0]); X.poly(x, [[14, 7], [20, 6], [21, 13], [13, 14]], PAPER[1]);
  X.line(x, 13, 7, 13, 14, PAPER[3]);
  for (let r = 0; r < 3; r++) { X.line(x, 7, 8 + r * 2, 11, 9 + r * 2, PAPER[3]); X.line(x, 15, 9 + r * 2, 19, 8 + r * 2, PAPER[2]); }
  outline(x); return x;
}

function bookshelf() {
  const x = layer(40, 48), COLS = ['#8a2a2a', '#2a5a3a', '#2a4a7a', '#7a5a2a', '#5a2a6a', '#3a3a4a', '#a8743a'];
  // the top, seen from above, then the frame
  X.poly(x, [[3, 3], [36, 3], [38, 8], [1, 8]], WOOD[1]); X.rect(x, 3, 3, 33, 1, WOOD[0]);
  plank(x, 1, 8, 38, 38, 3, 7); X.rect(x, 1, 8, 2, 38, WOOD[2]); X.rect(x, 37, 8, 2, 38, WOOD[4]);
  for (let s = 0; s < 3; s++) {
    const top = 10 + s * 12;
    X.rect(x, 4, top, 32, 10, WOOD[5]);
    let bx = 5;
    while (bx < 34) {
      const i = s * 31 + bx, w = 2 + Math.floor(rnd(i, 1) * 2), h = 6 + Math.floor(rnd(i, 2) * 4), col = COLS[Math.floor(rnd(i, 3) * COLS.length)];
      if (rnd(i, 5) < 0.14) { bx += 2; continue; } // a gap on the shelf
      if (bx + w > 35) break;
      X.rect(x, bx, top + 10 - h, w, h, col);
      X.rect(x, bx, top + 10 - h, 1, h, X.mix(col, '#ffffff', 0.22));
      X.px(x, bx + w - 1, top + 12 - h, '#e8d8b0');
      bx += w;
    }
    X.rect(x, 3, top + 10, 34, 2, WOOD[2]); X.rect(x, 3, top + 10, 34, 1, WOOD[1]);
  }
  outline(x); return x;
}

function target() {
  const x = layer(30, 36), cx = 15, cy = 13;
  // the stand, behind the disc
  X.line(x, 9, 18, 4, 34, WOOD[3], 2); X.line(x, 21, 18, 26, 34, WOOD[4], 2); X.line(x, 15, 20, 15, 31, WOOD[4], 2);
  X.line(x, 7, 27, 23, 27, WOOD[3]);
  // the straw: rings of colour, with a dithered thatch running round them
  const RINGS = [[12, '#e0c8a0'], [10, '#f4ece0'], [8, '#c8502a'], [5, '#f4ece0'], [3, '#ffd860']];
  for (const [r, c] of RINGS) X.ellipse(x, cx, cy, r, r * 0.94, c);
  for (let a = -13; a <= 13; a++) for (let b = -13; b <= 13; b++) {
    const d = Math.hypot(a, b / 0.94);
    if (d > 12 || (Math.floor(d * 1.5) + Math.floor(Math.atan2(b, a) * 9)) % 5) continue;
    if (bay(cx + a, cy + b) < 0.5) X.px(x, cx + a, cy + b, d > 10.2 ? '#b8946a' : d > 8.2 ? '#d8c0a0' : d > 5.2 ? '#a8401f' : '#e0c8a0');
  }
  // lit from the upper left
  X.ring(x, cx, cy, 12, 11.3, '#fff4c0', 1, Math.PI * 1.05, Math.PI * 1.6);
  X.ring(x, cx, cy, 12, 11.3, '#8a6a48', 1, Math.PI * 0.05, Math.PI * 0.6);
  outline(x); return x;
}

function runeCircle() {
  const x = layer(54, 30), cx = 27, cy = 15, FY = 0.55, R = 25;
  X.glow(x, cx, cy, R - 4, VIO[3], 0.35, FY);
  X.ring(x, cx, cy, R, R * FY, VIO[2]); X.ring(x, cx, cy, R - 6, (R - 6) * FY, VIO[2]);
  // two triangles, then the glyphs in the band between the rings
  for (const off of [0, Math.PI]) {
    const p = [0, 1, 2].map((k) => { const a = off - Math.PI / 2 + (k * Math.PI * 2) / 3; return [cx + Math.cos(a) * (R - 7), cy + Math.sin(a) * (R - 7) * FY]; });
    X.lines(x, [...p, p[0]], VIO[3]);
  }
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * Math.PI * 2, gx = cx + Math.cos(a) * (R - 3), gy = cy + Math.sin(a) * (R - 3) * FY;
    X.px(x, gx, gy, VIO[1]); X.px(x, gx + (k % 2 ? 1 : -1), gy, VIO[2]); if (k % 3 === 0) X.px(x, gx, gy - 1, VIO[0]);
  }
  X.ellipse(x, cx, cy, 2.5, 1.5, VIO[1]);
  return x; // a floor mark: no outline
}

function teacher() {
  const x = layer(24, 34), ROBE = ['#8a5ac8', '#6a3aa8', '#4a2a78', '#2e1a50'], GOLD = '#d8a868';
  // the robe: a bell, lit from the left, with a gold hem and front
  X.poly(x, [[8, 15], [16, 15], [20, 32], [4, 32]], ROBE[2]);
  X.poly(x, [[8, 15], [10, 15], [8, 32], [4, 32]], ROBE[1]);
  X.poly(x, [[15, 15], [16, 15], [20, 32], [17, 32]], ROBE[3]);
  X.rect(x, 4, 31, 16, 1, GOLD); X.line(x, 12, 18, 12, 31, GOLD);
  // the hands, the face and the beard
  X.rect(x, 5, 21, 2, 2, '#e0c8a0'); X.rect(x, 17, 21, 2, 2, '#c8a888');
  X.rect(x, 8, 11, 8, 5, '#e0c8a0'); X.px(x, 10, 12, '#1a1420'); X.px(x, 13, 12, '#1a1420');
  X.poly(x, [[8, 14], [16, 14], [14, 21], [12, 23], [10, 21]], '#d0d0dc'); X.line(x, 10, 15, 11, 20, '#ffffff');
  // the hat: a brim and a bent cone
  X.ellipse(x, 12, 10, 9, 2.5, ROBE[2]); X.ring(x, 12, 10, 9, 2.5, ROBE[1], 1, Math.PI, Math.PI * 1.6);
  X.poly(x, [[7, 9], [17, 9], [14, 3], [11, 1]], ROBE[2]); X.poly(x, [[7, 9], [10, 9], [11, 1]], ROBE[1]);
  X.line(x, 7, 8, 17, 8, GOLD);
  outline(x); return x;
}

const METAL = ['#c8ccd8', '#8a8e98', '#6e6878', '#3e3a48', '#26222e'];
const GOLD3 = ['#ffd860', '#d8a868', '#8a6a48'];

function desk() {
  const x = layer(46, 32);
  // the top, seen from above, then its front edge
  X.poly(x, [[4, 4], [41, 4], [44, 12], [1, 12]], WOOD[2]); X.rect(x, 4, 4, 37, 1, WOOD[0]);
  X.rect(x, 1, 12, 43, 3, WOOD[3]); X.rect(x, 1, 12, 43, 1, WOOD[1]);
  // two drawer pedestals and the dark kneehole between them
  X.rect(x, 3, 15, 40, 15, WOOD[5]);
  for (const l of [3, 30]) {
    plank(x, l, 15, 13, 15, 3, l); X.rect(x, l, 15, 2, 15, WOOD[2]); X.rect(x, l + 11, 15, 2, 15, WOOD[4]);
    for (const t of [17, 23]) { X.rect(x, l + 2, t, 9, 5, WOOD[4]); X.rect(x, l + 2, t, 9, 1, WOOD[3]); X.px(x, l + 6, t + 2, GOLD3[0]); }
  }
  // a sheet of writing, an ink pot and a quill
  X.poly(x, [[9, 6], [21, 6], [22, 11], [8, 11]], PAPER[1]); X.line(x, 10, 8, 19, 8, PAPER[3]); X.line(x, 10, 9, 17, 9, PAPER[3]);
  X.rect(x, 30, 6, 4, 4, '#26222e'); X.rect(x, 31, 5, 2, 1, METAL[1]); X.px(x, 31, 7, METAL[0]);
  X.line(x, 32, 5, 37, 0, PAPER[0]); X.line(x, 33, 5, 37, 1, PAPER[3]);
  outline(x); return x;
}

function chest() {
  const x = layer(30, 26);
  // the lid: a barrel top, lit from above
  X.rect(x, 2, 5, 26, 8, WOOD[3]); X.rect(x, 4, 3, 22, 2, WOOD[1]); X.rect(x, 2, 5, 26, 1, WOOD[2]);
  // the box
  plank(x, 2, 13, 26, 11, 3, 11); X.rect(x, 2, 13, 26, 1, WOOD[5]); X.rect(x, 2, 23, 26, 1, WOOD[5]);
  // iron bands and a brass lock
  for (const l of [5, 22]) { X.rect(x, l, 3, 3, 21, METAL[2]); X.rect(x, l, 3, 1, 21, METAL[1]); }
  X.rect(x, 12, 10, 6, 7, GOLD3[1]); X.rect(x, 12, 10, 6, 1, GOLD3[0]); X.rect(x, 14, 13, 2, 3, '#26222e');
  outline(x); return x;
}

function banner() {
  const x = layer(22, 36), B = ['#3a7ac0', '#1e5a96', '#143e6a'];
  // the pole, then the cloth, ending in a point
  X.rect(x, 1, 2, 20, 2, WOOD[3]); X.rect(x, 1, 2, 20, 1, WOOD[1]); X.rect(x, 0, 1, 2, 4, GOLD3[1]); X.rect(x, 20, 1, 2, 4, GOLD3[1]);
  X.poly(x, [[4, 4], [18, 4], [18, 28], [11, 34], [4, 28]], B[1]);
  X.poly(x, [[4, 4], [7, 4], [7, 31], [4, 28]], B[0]);
  X.poly(x, [[15, 4], [18, 4], [18, 28], [15, 31]], B[2]);
  // a gold edge and a plain diamond
  X.line(x, 4, 27, 11, 33, GOLD3[1]); X.line(x, 18, 27, 11, 33, GOLD3[1]);
  X.poly(x, [[11, 10], [15, 16], [11, 22], [7, 16]], GOLD3[1]); X.poly(x, [[11, 13], [13, 16], [11, 19], [9, 16]], B[2]);
  outline(x); return x;
}

function cauldron() {
  const x = layer(32, 32), cx = 16;
  // three stub feet, the pot lit from the left, a thick rim and the brew
  X.rect(x, 6, 27, 4, 4, METAL[3]); X.rect(x, 22, 27, 4, 4, METAL[4]); X.rect(x, 14, 28, 4, 3, METAL[3]);
  X.ellipse(x, cx, 19, 14, 10, METAL[3]); X.ellipse(x, cx - 3, 18, 8, 7, METAL[2]);
  X.ellipse(x, cx, 11, 13, 4.5, METAL[4]); X.ellipse(x, cx, 10, 13, 4, METAL[2]); X.ellipse(x, cx, 10, 10.5, 2.8, VIO[3]); X.ellipse(x, cx - 2, 10, 6, 1.6, VIO[2]);
  X.px(x, 13, 10, VIO[0]); X.px(x, 20, 9, VIO[1]);
  outline(x);
  X.rect(x, 12, 3, 2, 2, VIO[2]); X.px(x, 19, 1, VIO[1]); X.px(x, 16, 5, VIO[2]);
  return x;
}

function potions() {
  const x = layer(38, 42), LIQ = ['#c8502a', '#3a7ac0', '#b08aff', '#1e7a34', '#ffd860'];
  X.poly(x, [[3, 2], [34, 2], [37, 6], [0, 6]], WOOD[1]); X.rect(x, 3, 2, 31, 1, WOOD[0]);
  plank(x, 0, 6, 37, 34, 3, 17); X.rect(x, 0, 6, 2, 34, WOOD[2]); X.rect(x, 35, 6, 2, 34, WOOD[4]);
  for (let s = 0; s < 3; s++) {
    const top = 8 + s * 11;
    X.rect(x, 3, top, 31, 9, WOOD[5]);
    let bx = 5, n = s * 3;
    while (bx < 30) {
      const col = LIQ[n % LIQ.length], tall = (n + s) % 2 === 0;
      if (tall) { X.rect(x, bx, top + 5, 4, 4, col); X.rect(x, bx, top + 5, 1, 4, X.mix(col, '#ffffff', 0.35)); X.rect(x, bx + 1, top + 2, 2, 3, METAL[0]); X.px(x, bx + 1, top + 1, WOOD[1]); }
      else { X.ellipse(x, bx + 2, top + 7, 2.5, 2, col); X.px(x, bx + 1, top + 6, '#ffffff'); X.rect(x, bx + 1, top + 3, 2, 2, METAL[0]); }
      bx += 6; n++;
    }
    X.rect(x, 2, top + 9, 33, 2, WOOD[2]); X.rect(x, 2, top + 9, 33, 1, WOOD[1]);
  }
  outline(x); return x;
}

function clock() {
  const x = layer(22, 46), cx = 11;
  // a tall case with a round head, a dial, a glazed door and the pendulum
  X.ellipse(x, cx, 9, 9, 8, WOOD[3]); X.ring(x, cx, 9, 9, 8, WOOD[1], 1, Math.PI, Math.PI * 1.7);
  plank(x, 3, 12, 16, 28, 3, 21, true); X.rect(x, 3, 12, 2, 28, WOOD[2]); X.rect(x, 17, 12, 2, 28, WOOD[4]);
  X.rect(x, 1, 40, 20, 4, WOOD[3]); X.rect(x, 1, 40, 20, 1, WOOD[1]); X.rect(x, 1, 43, 20, 1, WOOD[5]);
  X.ellipse(x, cx, 9, 6, 5.6, PAPER[1]); X.ring(x, cx, 9, 6, 5.6, GOLD3[1]);
  X.line(x, cx, 9, cx, 5, '#26222e'); X.line(x, cx, 9, cx + 3, 10, '#26222e');
  X.rect(x, 7, 20, 8, 17, WOOD[5]); X.line(x, cx, 20, cx, 31, GOLD3[1]); X.ellipse(x, cx, 32, 2.4, 2.4, GOLD3[0]);
  outline(x); return x;
}

function throne() {
  const x = layer(30, 46), P = ['#7a4ad8', '#4a2a78', '#2a1848'];
  // the tall back with its peaks, then the cushion, arms and legs
  X.poly(x, [[4, 10], [9, 3], [15, 8], [21, 3], [26, 10], [26, 30], [4, 30]], WOOD[3]);
  X.px(x, 9, 2, GOLD3[0]); X.px(x, 21, 2, GOLD3[0]); X.px(x, 15, 7, GOLD3[0]);
  X.rect(x, 4, 10, 2, 20, WOOD[2]); X.rect(x, 24, 10, 2, 20, WOOD[4]);
  X.rect(x, 8, 12, 14, 17, P[1]); X.rect(x, 8, 12, 3, 17, P[0]); X.rect(x, 19, 12, 3, 17, P[2]);
  X.rect(x, 5, 29, 20, 5, P[1]); X.rect(x, 5, 29, 20, 1, P[0]);
  X.rect(x, 5, 34, 20, 3, WOOD[3]); X.rect(x, 5, 34, 20, 1, WOOD[1]);
  X.rect(x, 1, 24, 5, 3, WOOD[2]); X.rect(x, 24, 24, 5, 3, WOOD[3]); X.rect(x, 2, 27, 3, 17, WOOD[3]); X.rect(x, 25, 27, 3, 17, WOOD[4]);
  X.rect(x, 7, 37, 3, 7, WOOD[4]); X.rect(x, 20, 37, 3, 7, WOOD[4]);
  outline(x); return x;
}

function rack() {
  const x = layer(36, 36);
  // two rails on posts, the weapons leaning between them
  const heads = [[6, 8, METAL[0]], [13, 3, '#b08aff'], [20, 7, METAL[1]], [27, 4, '#ff9a30']];
  for (const [hx, top, col] of heads) {
    X.line(x, hx, top + 3, hx, 31, WOOD[2], 2);
    X.poly(x, [[hx - 1, top + 3], [hx + 2, top + 3], [hx + 1, top - 2], [hx, top - 2]], col);
    X.px(x, hx, top, '#ffffff');
  }
  X.rect(x, 1, 16, 34, 3, WOOD[3]); X.rect(x, 1, 16, 34, 1, WOOD[1]);
  X.rect(x, 1, 26, 34, 3, WOOD[3]); X.rect(x, 1, 26, 34, 1, WOOD[1]);
  for (const l of [1, 32]) { X.rect(x, l, 13, 3, 20, WOOD[3]); X.rect(x, l, 13, 1, 20, WOOD[1]); }
  X.rect(x, 0, 32, 6, 3, WOOD[4]); X.rect(x, 30, 32, 6, 3, WOOD[4]);
  outline(x); return x;
}

function crystal() {
  const x = layer(24, 38), cx = 12;
  // a stone pedestal under a glowing ball
  X.rect(x, 3, 33, 18, 4, METAL[3]); X.rect(x, 3, 33, 18, 1, METAL[1]);
  X.rect(x, 6, 20, 12, 13, METAL[2]); X.rect(x, 6, 20, 3, 13, METAL[1]); X.rect(x, 15, 20, 3, 13, METAL[3]);
  X.rect(x, 4, 17, 16, 3, METAL[2]); X.rect(x, 4, 17, 16, 1, METAL[0]);
  X.ellipse(x, cx, 9, 8, 8, VIO[2]); X.ellipse(x, cx - 1, 8, 6, 6, VIO[1]); X.ellipse(x, cx - 3, 6, 2.5, 2, '#ffffff');
  X.ring(x, cx, 9, 8, 8, VIO[3], 1, 0.2, 2.4);
  outline(x); return x;
}

function armillary() {
  const x = layer(28, 36), cx = 14, cy = 13, G = GOLD3;
  // a foot and stem, then gold rings round a small sun
  X.rect(x, 7, 32, 14, 3, WOOD[3]); X.rect(x, 7, 32, 14, 1, WOOD[1]); X.rect(x, 12, 25, 4, 7, WOOD[3]); X.rect(x, 12, 25, 1, 7, WOOD[1]);
  X.ring(x, cx, cy, 12, 12, G[1]); X.ring(x, cx, cy, 12, 12, G[0], 1, Math.PI, Math.PI * 1.6);
  X.ring(x, cx, cy, 12, 4, G[1]); X.ring(x, cx, cy, 4, 12, G[2]);
  X.ring(x, cx, cy, 8, 8, G[2]);
  X.ellipse(x, cx, cy, 3, 3, '#ff9a30'); X.px(x, cx - 1, cy - 1, G[0]);
  outline(x); return x;
}

function dummyProp() {
  const x = layer(28, 38);
  // a post and crossbar under a sackcloth body
  const S = PAPER[3], D = WOOD[2];
  X.rect(x, 13, 22, 3, 13, WOOD[3]); X.rect(x, 13, 22, 1, 13, WOOD[1]);
  X.rect(x, 8, 34, 13, 3, WOOD[4]); X.rect(x, 8, 34, 13, 1, WOOD[2]);
  X.rect(x, 2, 12, 24, 3, D); X.rect(x, 2, 12, 24, 1, S);
  X.poly(x, [[8, 10], [20, 10], [21, 24], [7, 24]], D); X.poly(x, [[8, 10], [12, 10], [11, 24], [7, 24]], S);
  X.ellipse(x, 14, 6, 5, 5, D); X.ellipse(x, 13, 5, 3.5, 3.5, S);
  X.line(x, 8, 17, 20, 17, WOOD[4]);
  outline(x); return x;
}

const sheet = document.getElementById('sheet').getContext('2d');
sheet.fillStyle = '#ff00ff'; sheet.fillRect(0, 0, 210, 56);
let at = 3;
for (const p of [lectern(), bookshelf(), target(), runeCircle(), teacher()]) { sheet.drawImage(p.canvas, at, 52 - p.canvas.height); at += p.canvas.width + 6; }
document.getElementById('out').textContent = document.getElementById('sheet').toDataURL('image/png');
// Every prop, one PNG each, for the mock room's `code` set: code-dump.mjs reads this.
const ALL = { lectern, bookshelf, target, 'rune-circle': runeCircle, teacher, desk, chest, banner, cauldron, 'potion-shelf': potions, clock, throne, 'weapon-rack': rack, 'crystal-ball': crystal, armillary, 'training-dummy': dummyProp };
document.getElementById('all').textContent = JSON.stringify(Object.fromEntries(Object.entries(ALL).map(([k, f]) => [k, f().canvas.toDataURL('image/png')])));
</script>
